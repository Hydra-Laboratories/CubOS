# Three transfers, each followed by a route-planned camera move and A1 photo.
protocol:
  - pick_up_tip:
      position: tips.A1
  - transfer:
      source: stocks.A1
      destination: plate.A1
      volume_ul: 100
      source_height: -20
  - move:
      instrument: camera
      position: plate.A1
  - capture:
      instrument: camera
      position: plate.A1
      label: A1_after_dispense_1
  - drop_tip:
      position: waste
  - pick_up_tip:
      position: tips.A2
  - transfer:
      source: stocks.A2
      destination: plate.A1
      volume_ul: 100
      source_height: -20
  - move:
      instrument: camera
      position: plate.A1
  - capture:
      instrument: camera
      position: plate.A1
      label: A1_after_dispense_2
  - drop_tip:
      position: waste
  - pick_up_tip:
      position: tips.A3
  - transfer:
      source: stocks.A3
      destination: plate.A1
      volume_ul: 100
      source_height: -20
  - move:
      instrument: camera
      position: plate.A1
  - capture:
      instrument: camera
      position: plate.A1
      label: A1_after_dispense_3
  - mix:
      position: plate.A1
      volume_ul: 60
      cycles: 3
      height: -3
  - drop_tip:
      position: waste
