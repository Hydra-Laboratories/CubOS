# PANDA gantry configuration for the CubOS home-origin (signed) frame.
#
# home_origin policy: WPos zero is the homed back-right-top corner and the
# entire reachable workspace is negative. +X right, +Y back, +Z up — the axis
# directions match deck_origin; only the zero corner differs. After a
# successful home, WPos must read (0, 0, 0).
#
# Working volume verified against PANDA-BEAR's mill configuration
# (src/panda_lib/hardware/grbl_cnc_mill/_configuration.json, and the
# cubos-migration-2026-06-30 backup): $130=401, $131=301, $132=85, soft
# limits on. Production DB positions (e.g. vial z near -195) are TOOL-POINT
# coordinates that include tools.json offsets (pipette/electrode z +100,
# decapper +61.5); the gantry itself travels 401 x 301 x 85. Instrument
# offsets below are the tools.json values converted to CubOS semantics
# (offset_cubos = -offset_pandabear, depth = +z offset). Confirm live
# $130/$131/$132, the serial device path, homing corner, and jog directions
# before trusting physical motion.

serial_port: /dev/ttyUSB0
gantry_type: cub_xl
origin_policy: home_origin

cnc:
  default_feed_rate_mm_min: 3000.0
  factory_z_travel_mm: 100.0
  y_axis_motion: head
  # Absolute Z ceiling for inter-labware travel, 5 mm below the homed top.
  safe_z: -5.0

working_volume:
  x_min: -401.0
  x_max: 0.0
  y_min: -301.0
  y_max: 0.0
  z_min: -85.0
  z_max: 0.0

grbl_settings:
  # Starting point copied from the deck-origin PANDA config (cub_xl_panda.yaml).
  # Re-verify on the actual PANDA controller before trusting physical motion.
  dir_invert_mask: 1
  status_report: 0
  homing_enable: true
  homing_dir_mask: 0
  steps_per_mm_x: 400.0
  steps_per_mm_y: 400.0
  steps_per_mm_z: 400.0
  max_travel_x: 401.0
  max_travel_y: 301.0
  max_travel_z: 85.0

instruments:
  # Electrode probe; from tools.json "electrode" (56.7, -3.8, z 100).
  potentiostat:
    type: potentiostat
    vendor: admiral
    port: ""
    channel: 0
    offline: true
    offset_x: -56.7
    offset_y: 3.8
    depth: 100.0

  # Center lens; tools.json "lens" is the zero-offset reference tool.
  camera:
    type: camera
    vendor: mount_only
    offline: true
    offset_x: 0.0
    offset_y: 0.0
    depth: 0.0

  # Capper/decapper; from tools.json "decapper" (-62.9, -5.1, z 61.5).
  vial_capper_decapper:
    type: mounted_tool
    vendor: mount_only
    offline: true
    offset_x: 62.9
    offset_y: 5.1
    depth: 61.5
