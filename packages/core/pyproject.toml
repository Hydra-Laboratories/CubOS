[project]
name = "cubos"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyserial",
    "pyyaml",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "diff-cover",
]
# Per-vendor SDKs — opt in only when you actually use that driver.
# The drivers import these lazily and raise a clear error if missing, so the core
# install (and instruments that don't need them) stays light.
asmi-vernier = [
    "godirect>=1.0.0",
]
potentiostat-admiral = [
    "SquidstatPyLibrary",
]
# PyPI's hardpotato (<=1.3.13) predates Setup.check_connection; the driver
# needs the 1.3.14 git build. EmStat4 LR ("emstat4_lr") additionally needs a
# not-yet-public patch (hardpotato/emstat4_lr.py + potentiostat.py hooks)
# carried in the PANDA bench venvs — upstream or fork it before relying on a
# clean install for that model.
potentiostat-emstat = [
    "hardpotato @ git+https://github.com/BU-KABlab/hardpotato.git@87584e4cc03773cb7484d99309f86817809047bf",
]
asmi = [
    "godirect>=1.0.0",
]
potentiostat = [
    "SquidstatPyLibrary",
    "hardpotato @ git+https://github.com/BU-KABlab/hardpotato.git@87584e4cc03773cb7484d99309f86817809047bf",
]
# camera: OpenCV covers both the `opencv` webcam vendor and image saving for
# the `flir` vendor. `harvesters` is the pip-installable GenTL client used by
# the flir vendor's backend="gentl" (talks to the Spinnaker SDK's GenTL
# producer, Spinnaker_GenTL.cti — a plain shared library, so this works on
# any CPython version). backend="pyspin" (the default) instead needs
# PySpin itself, which is proprietary (Spinnaker SDK, manual install from
# https://www.flir.com/products/spinnaker-sdk/), tied to one CPython ABI per
# release, and cannot be a pip dependency; the flir driver imports it lazily
# and raises a clear error with the install pointer when missing.
camera = [
    "opencv-python",
    "numpy",
    "harvesters",
]
docs = [
    "mkdocs>=1.6",
    # Pinned below 0.6: 0.6.0+ added a hard dependency on `properdocs`, which
    # runs an unreviewed nag routine at import time on every build. Re-check
    # this pin before bumping.
    "mkdocs-gen-files>=0.5,<0.6",
    "mkdocstrings[python]>=0.27",
    "pymdown-extensions>=10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cubos", "cubos.*"]

[tool.setuptools.package-data]
"cubos.instruments" = ["registry.yaml"]
"cubos.gantry.gantry_driver" = ["*.json"]
# Deck labware definitions: registry.yaml at the package root + each
# definition's config YAML in a non-package subdir. Without these the
# `load_name:` deck-yaml feature breaks under `pip install` because the
# YAMLs don't get copied to site-packages.
"cubos.deck.labware.definitions" = [
    "registry.yaml",
    "*/*.yaml",
    "*/*.glb",
    "*/*.stl",
    "*/*.step",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
