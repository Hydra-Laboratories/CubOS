# Supported instrument types, vendor implementations, and calibration metadata.
# Gantry YAML selects a generic `type` plus a concrete `vendor`.

instruments:
  asmi:
    interface: cubos.instruments.asmi.interface.ASMIInstrument
    calibration_mode: contact
    vendors:
      vernier:
        module: cubos.instruments.asmi.vendors.vernier
        class_name: VernierASMI

  filmetrics:
    interface: cubos.instruments.filmetrics.interface.FilmetricsInstrument
    calibration_mode: contact
    vendors:
      kla:
        module: cubos.instruments.filmetrics.vendors.kla
        class_name: KLAFilmetrics

  pipette:
    interface: cubos.instruments.pipette.interface.PipetteInstrument
    calibration_mode: contact
    vendors:
      opentrons:
        module: cubos.instruments.pipette.vendors.opentrons
        class_name: OpentronsPipette
      sartorius:
        module: cubos.instruments.pipette.vendors.sartorius
        class_name: SartoriusPicus2Pipette

  potentiostat:
    interface: cubos.instruments.potentiostat.interface.PotentiostatInstrument
    calibration_mode: contact
    vendors:
      admiral:
        module: cubos.instruments.potentiostat.vendors.admiral
        class_name: AdmiralPotentiostat
      emstat:
        module: cubos.instruments.potentiostat.vendors.emstat
        class_name: EmstatPotentiostat

  uv_curing:
    interface: cubos.instruments.uv_curing.interface.UVCuringInstrument
    calibration_mode: contact
    vendors:
      excelitas:
        module: cubos.instruments.uv_curing.vendors.excelitas
        class_name: ExcelitasUVCuring

  uvvis_ccs:
    interface: cubos.instruments.uvvis_ccs.interface.UVVisCCSInstrument
    calibration_mode: contact
    vendors:
      thorlabs:
        module: cubos.instruments.uvvis_ccs.vendors.thorlabs
        class_name: ThorlabsUVVisCCS

  capper:
    interface: cubos.instruments.capper.interface.CapperInstrument
    calibration_mode: contact
    vendors:
      mock:
        module: cubos.instruments.capper.vendors.mock
        class_name: MockCapper
      pawduino:
        module: cubos.instruments.capper.vendors.pawduino
        class_name: PawduinoCapper

  camera:
    interface: cubos.instruments.camera.interface.CameraInstrument
    calibration_mode: non_contact
    vendors:
      mount_only:
        module: cubos.instruments.camera.vendors.mount_only
        class_name: MountOnlyCamera
      raspberry_pi:
        module: cubos.instruments.camera.vendors.raspberry_pi
        class_name: RaspberryPiCamera
      flir:
        module: cubos.instruments.camera.vendors.flir
        class_name: FlirCamera
      opencv:
        module: cubos.instruments.camera.vendors.opencv
        class_name: OpenCVCamera

  lighting:
    interface: cubos.instruments.lighting.interface.LightingInstrument
    calibration_mode: follow_camera
    vendors:
      pawduino:
        module: cubos.instruments.lighting.vendors.pawduino
        class_name: PawduinoLighting

  mounted_tool:
    interface: cubos.instruments.mounted_tool.interface.MountedToolInstrument
    calibration_mode: contact
    vendors:
      mount_only:
        module: cubos.instruments.mounted_tool.vendors.mount_only
        class_name: MountOnlyTool
