# Labware definition registry: maps each definition name to the Labware
# subclass that implements it and the YAML config file that supplies the
# class attributes (everything except `location`, which is set per-instance
# in a deck YAML).
#
# Ursa (PANDA-BEAR) labware lives under the `ursa_` prefix so it can
# coexist with other vendors (e.g. opentrons, sbs) added later.

labware:
  analytical_sales_96_aluminum_vial_well_plate:
    module: cubos.deck.labware.well_plate
    class_name: WellPlate
    config: analytical_sales_96_aluminum_vial_well_plate/AluminumVialWellPlate.yaml

  ursa_vial_holder:
    module: cubos.deck.labware.vial_holder
    class_name: VialHolder
    config: ursa_vial_holder/9VialHolder.yaml

  ursa_9_vial_grid:
    module: cubos.deck.labware.vial_grid
    class_name: VialGrid
    config: ursa_9_vial_grid/9VialGrid.yaml
  ursa_12_vial_holder_4ml:
    module: cubos.deck.labware.vial_holder
    class_name: VialHolder
    config: ursa_12_vial_holder_4ml/12VialHolder4mL.yaml

  ursa_12_vial_grid_4ml:
    module: cubos.deck.labware.vial_grid
    class_name: VialGrid
    config: ursa_12_vial_grid_4ml/12VialGrid4mL.yaml

  ursa_13x2_tip_rack:
    module: cubos.deck.labware.tip_rack
    class_name: TipRack
    config: ursa_13x2_tip_rack/TipRack13x2.yaml

  ursa_tip_rack:
    module: cubos.deck.labware.tip_rack
    class_name: TipRack
    config: ursa_tip_rack/TipRack.yaml

  ursa_wellplate_holder:
    module: cubos.deck.labware.well_plate_holder
    class_name: WellPlateHolder
    config: ursa_wellplate_holder/WellplateHolder.yaml

  ursa_wellplate_holder_conductive:
    module: cubos.deck.labware.well_plate_holder
    class_name: WellPlateHolder
    config: ursa_wellplate_holder_conductive/WellplateHolder.yaml

  sharc_80mm_sbs_wellplate_holder:
    module: cubos.deck.labware.well_plate_holder
    class_name: WellPlateHolder
    config: sharc_80mm_sbs_wellplate_holder/WellplateHolder.yaml

  panda_sbs_wellplate_holder:
    module: cubos.deck.labware.well_plate_holder
    class_name: WellPlateHolder
    config: panda_sbs_wellplate_holder/WellplateHolder.yaml

  sbs_96_wellplate:
    module: cubos.deck.labware.well_plate
    class_name: WellPlate
    config: sbs_96_wellplate/SBS96WellPlate.yaml

  sbs_24_wellplate:
    module: cubos.deck.labware.well_plate
    class_name: WellPlate
    config: sbs_24_wellplate/SBS24WellPlate.yaml

  ursa_12_well_plate:
    module: cubos.deck.labware.well_plate
    class_name: WellPlate
    config: ursa_12_well_plate/12WellPlate.yaml

  ursa_20_well_plate:
    module: cubos.deck.labware.well_plate
    class_name: WellPlate
    config: ursa_20_well_plate/20WellPlate.yaml
