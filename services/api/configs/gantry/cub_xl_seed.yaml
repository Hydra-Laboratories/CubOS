# Seed config for the cub_xl gantry family.
#
# factory_z_travel_mm is the carriage stroke available BELOW the homed position
# — not the "Z working range" printed on the machine label. The label figure
# (110 mm) measures home -> the *stock* bed surface, which coincides with the
# stroke only on an unmodified base; a lowered deck decouples the two. Measured
# 2026-08-17 on the ASMI cub_xl by jogging Z from home to the bottom limit:
# 117 mm below home (~120 mm switch-to-switch with the 3 mm $27 pull-off).
serial_port: ""
gantry_type: cub_xl
cnc:
  default_feed_rate_mm_min: 3000.0
  factory_z_travel_mm: 117.0
  calibration_block_height_mm: 35.0
  y_axis_motion: head
  safe_z: 85.0
working_volume:
  x_min: 0.0
  x_max: 386.0
  y_min: 0.0
  y_max: 250.0
  z_min: 0.0
  z_max: 87.0
grbl_settings:
  dir_invert_mask: 1
  status_report: 0
  soft_limits: true
  hard_limits: true
  homing_enable: true
  homing_dir_mask: 0
  steps_per_mm_x: 400.0
  steps_per_mm_y: 400.0
  steps_per_mm_z: 400.0
  max_travel_x: 386.0
  max_travel_y: 250.0
  max_travel_z: 87.0
instruments: {}
