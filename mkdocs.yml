site_name: CubOS
site_description: Documentation for CubOS, the CNC-based lab automation platform.
theme:
  name: readthedocs

nav:
  - Home: index.md
  - Set Up and Use CubOS:
    - Getting Started: getting-started.md
    - Use the Operator UI:
      - Overview: operator-ui.md
      - Gantry, Connect and Move: operator-ui/gantry.md
      - Calibrate the Gantry: operator-ui/calibrate-gantry.md
      - Deck and Labware: operator-ui/deck-and-labware.md
      - Protocols: operator-ui/protocols.md
      - Results and State: operator-ui/results-and-state.md
    - Gantry Bring-Up: admin/gantry-bring-up.md
    - Set Up Gantry YAML: gantry-setup.md
    - Calibrate Gantry: calibration.md
    - Set Up Deck and Labware: deck.md
    - Side-Exit Tip Rack: side-exit-tip-rack.md
    - Run a Protocol with YAML: protocol-yaml.md
    - Fluid State Tracking: fluid-state.md
    - PANDA-CUB Quickstart: panda-cub-quickstart.md
    - EmStat Cyclic Voltammetry: emstat-cv.md
    - Data: data.md
    - Troubleshooting & Recovery: troubleshooting.md
  - Contributing to CubOS:
    - Overview: contributing.md
    - Development Setup: development.md
    - Gantry Internals: gantry.md
    - Deck Internals: deck-internals.md
    - Python Protocols: protocol-python.md
    - YAML File Overview: configuration.md
    - Appendix: appendix.md
  - API Reference:
    - Overview: reference/index.md
    - cubos: reference/cubos/index.md
    - deck: reference/cubos/deck/index.md
    - gantry: reference/cubos/gantry/index.md
    - instruments: reference/cubos/instruments/index.md
    - protocol_engine:
      - Overview: reference/cubos/protocol_engine/index.md
      - Commands:
        - move: reference/cubos/protocol_engine/commands/move.md
        - scan: reference/cubos/protocol_engine/commands/scan.md
        - measure: reference/cubos/protocol_engine/commands/measure.md
        - pipette: reference/cubos/protocol_engine/commands/pipette.md
        - home: reference/cubos/protocol_engine/commands/home.md
        - pause: reference/cubos/protocol_engine/commands/pause.md
    - validation: reference/cubos/validation/index.md
    - data: reference/cubos/data/index.md

not_in_nav: |
  agent-index.md
  reference/cubos/**

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/core/src
          options:
            members_order: source
            merge_init_into_class: true
            show_root_heading: true
            show_root_toc_entry: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: false
            separate_signature: true
            signature_crossrefs: true
            show_signature_annotations: true
            unwrap_annotated: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: false
  - tables
  - toc:
      permalink: true
